global:
  gc: true
  measurements: []

jobs:
  - name: create-vms
    jobType: create
    namespace: burner-hotplug
    namespacedIterations: false
    jobIterations: 1
    qps: 5
    burst: 5
    waitWhenFinished: false
    objects:
      - objectTemplate: vm-hotplug-template.yml
        replicas: 4
        wait: false
        inputVars:
          memory: 128Mi

  - name: start-vms
    jobType: kubevirt
    executionMode: parallel
    jobPause: 60s
    objects:
      - kubeVirtOp: start
        labelSelector: {kube-burner.io/job: create-vms}

  # Hot-plug: attach a PVC to each running VM
  - name: add-volumes
    jobType: kubevirt
    executionMode: sequential
    jobPause: 15s
    objects:
      - kubeVirtOp: add-volume
        labelSelector: {kube-burner.io/job: create-vms}
        inputVars:
          volumeName: hotplug-pvc-{{.Replica}}
          diskType: disk

  # Hot-unplug: detach the PVC from each running VM
  - name: remove-volumes
    jobType: kubevirt
    executionMode: sequential
    jobPause: 10s
    objects:
      - kubeVirtOp: remove-volume
        labelSelector: {kube-burner.io/job: create-vms}
        inputVars:
          volumeName: hotplug-pvc-{{.Replica}}

  - name: stop-vms
    jobType: kubevirt
    executionMode: parallel
    objects:
      - kubeVirtOp: stop
        labelSelector: {kube-burner.io/job: create-vms}
        inputVars:
          force: false
