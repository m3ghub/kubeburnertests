apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: win-vm-{{.Iteration}}-{{.Replica}}
  labels:
    app: kube-burner-windows
    kube-burner-job: create-windows-vms
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: win-disk-{{.Iteration}}-{{.Replica}}
      spec:
        source:
          pvc:
            namespace: openshift-virtualization-os-images
            name: win2k22
        storage:
          accessModes:
            - ReadWriteOnce          # Windows does not support ReadWriteMany
          resources:
            requests:
              storage: 50Gi
  template:
    metadata:
      labels:
        app: kube-burner-windows
        kube-burner-job: create-windows-vms
    spec:
      domain:
        cpu:
          cores: 2
        resources:
          requests:
            memory: 4Gi
        features:
          acpi: {}
          apic: {}
          hyperv:
            relaxed: {}
            spinlocks:
              spinlocks: 8191
            vapic: {}
        clock:
          utc: {}
          timer:
            hpet:
              present: false
            pit:
              tickPolicy: delay
            rtc:
              tickPolicy: catchup
            hyperv: {}
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: sata
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: win-disk-{{.Iteration}}-{{.Replica}}
