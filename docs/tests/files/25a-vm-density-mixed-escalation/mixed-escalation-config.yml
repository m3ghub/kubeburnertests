global:
  gc: true
  measurements:
    - name: vmiLatency

jobs:
  # Round 01: 5 VMs (3 Windows + 2 RHEL)
  - name: r01-create-windows
    jobType: create
    namespace: burner-mixed-escalation
    jobIterations: 1
    namespacedIterations: false
    podWait: false
    waitWhenFinished: false
    maxWaitTimeout: 120m
    objects:
      - objectTemplate: /config/vm-template-windows.yml
        replicas: 3

  - name: r01-create-rhel
    jobType: create
    namespace: burner-mixed-escalation
    jobIterations: 1
    namespacedIterations: false
    podWait: false
    waitWhenFinished: true
    maxWaitTimeout: 120m
    objects:
      - objectTemplate: /config/vm-template-rhel.yml
        replicas: 2

  - name: r01-delete
    jobType: delete
    namespace: burner-mixed-escalation
    waitForDeletion: true
    objects:
      - apiVersion: kubevirt.io/v1
        kind: VirtualMachine
        labelSelector:
          app: mixed-fleet-escalation

