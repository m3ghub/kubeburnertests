apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: r4-rhel9-{{.Iteration}}-{{.Replica}}
  labels:
    app: test22b-churn
    round: r04
    os: rhel9
spec:
  running: true
  dataVolumeTemplates:
    - metadata:
        name: r4-rhel9-disk-{{.Iteration}}-{{.Replica}}
      spec:
        sourceRef:
          kind: DataSource
          name: rhel9
          namespace: openshift-virtualization-os-images
        storage:
          resources:
            requests:
              storage: 30Gi
  template:
    metadata:
      labels:
        app: test22b-churn
        round: r04
        os: rhel9
    spec:
      domain:
        cpu:
          cores: 2
        resources:
          requests:
            memory: 4Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: r4-rhel9-disk-{{.Iteration}}-{{.Replica}}
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: r4-rhel9-{{.Iteration}}-{{.Replica}}
