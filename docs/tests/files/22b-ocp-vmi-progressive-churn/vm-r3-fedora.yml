apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: r3-fedora-{{.Iteration}}-{{.Replica}}
  labels:
    app: test22b-churn
    round: r03
    os: fedora
spec:
  running: true
  dataVolumeTemplates:
    - metadata:
        name: r3-fedora-disk-{{.Iteration}}-{{.Replica}}
      spec:
        sourceRef:
          kind: DataSource
          name: fedora
          namespace: openshift-virtualization-os-images
        storage:
          resources:
            requests:
              storage: 30Gi
  template:
    metadata:
      labels:
        app: test22b-churn
        round: r03
        os: fedora
    spec:
      domain:
        cpu:
          cores: 1
        resources:
          requests:
            memory: 2Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: r3-fedora-disk-{{.Iteration}}-{{.Replica}}
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: r3-fedora-{{.Iteration}}-{{.Replica}}
