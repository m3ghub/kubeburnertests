    namespace: burner-mixed-churn
    jobType: create
    jobIterations: 1
    namespacedIterations: false
    waitWhenFinished: false
    maxWaitTimeout: 30m
    objects:
      - objectTemplate: vm-template-windows.yml
        replicas: 4

  - name: r01-cre-rh
    namespace: burner-mixed-churn
    jobType: create
    jobIterations: 1
    namespacedIterations: false
    waitWhenFinished: true
    maxWaitTimeout: 15m
    objects:
      - objectTemplate: vm-template-rhel.yml
        replicas: 2

  # ------------ Churn Cycle 1 of 3 ------------
  - name: r01-c1-del-win
    namespace: burner-mixed-churn
    jobType: delete
    waitForDeletion: true
