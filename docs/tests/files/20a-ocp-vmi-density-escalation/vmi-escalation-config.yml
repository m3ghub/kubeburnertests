global:
  gc: true
  measurements:
    - name: vmiLatency

jobs:
  # Round 01: 10 VMIs
  - name: r01-create
    jobType: create
    namespace: burner-vmi-density-escalation
    jobIterations: 1
    namespacedIterations: false
    waitWhenFinished: true
    maxWaitTimeout: 45m
    objects:
      - objectTemplate: /config/vm-template.yml
        replicas: 10

  - name: r01-delete
    jobType: delete
    namespace: burner-vmi-density-escalation
    waitForDeletion: true
    objects:
      - apiVersion: kubevirt.io/v1
        kind: VirtualMachine
        labelSelector:
          kube-burner.io/job: r01-create

  # Round 02: 25 VMIs
