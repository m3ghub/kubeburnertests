apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: burner-vm-{{.Iteration}}-{{.Replica}}
  labels:
    app: kube-burner-vm
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app: kube-burner-vm
    spec:
      domain:
        resources:
          requests:
            memory: 128Mi
        devices:
          disks:
            - name: containerdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: containerdisk
          containerDisk:
            image: quay.io/kubevirt/cirros-registry-disk-demo:latest
