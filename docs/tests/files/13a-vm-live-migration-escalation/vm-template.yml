apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: mig-esc-{{.Iteration}}-{{.Replica}}
  labels:
    app: migration-escalation
spec:
  running: false
  template:
    metadata:
      labels:
        app: migration-escalation
    spec:
      domain:
        cpu:
          cores: 1
        resources:
          requests:
            memory: 128Mi
        devices:
          disks:
            - name: containerdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: containerdisk
          containerDisk:
            image: quay.io/kubevirt/cirros-registry-disk-demo:latest
