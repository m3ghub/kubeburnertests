global:
  gc: true
  measurements:
    - name: vmiLatency

jobs:
  # Round 01: 2 VMs
  - name: r01-create
    jobType: create
    namespace: burner-migration-escalation
    jobIterations: 1
    namespacedIterations: false
    waitWhenFinished: true
    maxWaitTimeout: 20m
    objects:
      - objectTemplate: /config/vm-template.yml
        replicas: 2
        wait: false

  - name: r01-start
    jobType: kubevirt
    executionMode: parallel
    jobPause: 60s
    objects:
      - kubeVirtOp: start
        labelSelector:
          kube-burner.io/job: r01-create

  - name: r01-migrate
    jobType: kubevirt
    executionMode: parallel
    jobPause: 120s
    objects:
      - kubeVirtOp: migrate
        labelSelector:
          kube-burner.io/job: r01-create

  - name: r01-stop
    jobType: kubevirt
    executionMode: parallel
    jobPause: 60s
    objects:
      - kubeVirtOp: stop
        labelSelector:
          kube-burner.io/job: r01-create

  - name: r01-delete
    jobType: delete
    namespace: burner-migration-escalation
    waitForDeletion: true
    objects:
      - apiVersion: kubevirt.io/v1
        kind: VirtualMachine
        labelSelector:
          kube-burner.io/job: r01-create

