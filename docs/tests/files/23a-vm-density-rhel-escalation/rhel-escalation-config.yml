global:
  gc: true
  measurements:
    - name: vmiLatency

jobs:
  # Round 01: 5 RHEL VMs
  - name: r01-create
    jobType: create
    namespace: burner-rhel-density-escalation
    jobIterations: 1
    namespacedIterations: false
    waitWhenFinished: true
    maxWaitTimeout: 90m
    objects:
      - objectTemplate: /config/vm-template-rhel.yml
        replicas: 5

  - name: r01-delete
    jobType: delete
    namespace: burner-rhel-density-escalation
    waitForDeletion: true
    objects:
      - apiVersion: kubevirt.io/v1
        kind: VirtualMachine
        labelSelector:
          kube-burner.io/job: r01-create

  # Round 02: 10 RHEL VMs
