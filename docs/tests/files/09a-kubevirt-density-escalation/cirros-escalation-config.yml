global:
  gc: true
  measurements:
    - name: vmiLatency

jobs:
  # Round 01: 5 VMs
  - name: r01-create
    jobType: create
    namespace: burner-escalation
    jobIterations: 1
    namespacedIterations: false
    waitWhenFinished: true
    maxWaitTimeout: 30m
    objects:
      - objectTemplate: /config/vm-template.yml
        replicas: 5

  - name: r01-delete
    jobType: delete
    namespace: burner-escalation
    waitForDeletion: true
    objects:
      - apiVersion: kubevirt.io/v1
        kind: VirtualMachine
        labelSelector:
          kube-burner.io/job: r01-create

  # Round 02: 15 VMs
