global:
  gc: false
  measurements:
    - name: vmiLatency

jobs:
  # ─────────────────────────────────────────
  # ROUND 1 — 3 Windows VMs  (~150Gi storage)
  # ─────────────────────────────────────────
  - name: windows-round1-create
    namespace: burner-windows-escalation
    jobType: create
    jobIterations: 1
    namespacedIterations: false
    qps: 2
    burst: 2
    objects:
      - objectTemplate: /config/windows-escalation-vm.yml
        replicas: 3
    waitWhenFinished: true
    maxWaitTimeout: 60m
    jobPause: 60s

  - name: windows-round1-delete
    namespace: burner-windows-escalation
    jobType: delete
    qps: 2
    burst: 2
    objects:
      - kind: VirtualMachine
        apiVersion: kubevirt.io/v1
        labelSelector:
          kube-burner-job: windows-round1-create
    jobPause: 120s

  # ─────────────────────────────────────────
  # ROUND 2 — 5 Windows VMs  (~250Gi storage)
  # ─────────────────────────────────────────
  - name: windows-round2-create
    namespace: burner-windows-escalation
    jobType: create
    jobIterations: 1
    namespacedIterations: false
    qps: 2
    burst: 2
    objects:
      - objectTemplate: /config/windows-escalation-vm.yml
        replicas: 5
    waitWhenFinished: true
    maxWaitTimeout: 90m
    jobPause: 60s

  - name: windows-round2-delete
    namespace: burner-windows-escalation
    jobType: delete
    qps: 2
    burst: 2
    objects:
      - kind: VirtualMachine
        apiVersion: kubevirt.io/v1
        labelSelector:
          kube-burner-job: windows-round2-create
    jobPause: 120s

  # ─────────────────────────────────────────
  # ROUND 3 — 8 Windows VMs  (~400Gi storage)
  # Only run if cluster has 32Gi+ free RAM and 400Gi+ free storage
  # ─────────────────────────────────────────
  - name: windows-round3-create
    namespace: burner-windows-escalation
    jobType: create
    jobIterations: 1
    namespacedIterations: false
    qps: 2
    burst: 2
    objects:
      - objectTemplate: /config/windows-escalation-vm.yml
        replicas: 8
    waitWhenFinished: true
    maxWaitTimeout: 120m
    jobPause: 60s

  - name: windows-round3-delete
    namespace: burner-windows-escalation
    jobType: delete
    qps: 2
    burst: 2
    objects:
      - kind: VirtualMachine
        apiVersion: kubevirt.io/v1
        labelSelector:
          kube-burner-job: windows-round3-create
