global:
  gc: false
  measurements:
    - name: vmiLatency

jobs:
  # ============================================================
  # ROUND 1: cirros only — 6 VMs, 1vCPU/512Mi, 3 churn cycles
  # Same as 22B: containerDisk baseline, warms up the control plane
  # ============================================================
  - name: r01-cre-cirros
    namespace: burner-test22c
    jobType: create
    jobIterations: 1
    namespacedIterations: false
    waitWhenFinished: true
    maxWaitTimeout: 10m
    objects:
      - objectTemplate: vm-r1-cirros.yml
        replicas: 6

  - name: r01-c1-del
    namespace: burner-test22c
    jobType: delete
    waitForDeletion: true
    objects:
      - apiVersion: kubevirt.io/v1
        kind: VirtualMachine
        labelSelector:
          kube-burner.io/job: r01-cre-cirros

  - name: r01-c1-cre
    namespace: burner-test22c
    jobType: create
    jobIterations: 1
    namespacedIterations: false
    waitWhenFinished: true
    maxWaitTimeout: 10m
    objects:
      - objectTemplate: vm-r1-cirros.yml
        replicas: 6

  - name: r01-c2-del
    namespace: burner-test22c
    jobType: delete
    waitForDeletion: true
