global:
  gc: true
  measurements:
    - name: vmiLatency

jobs:
  # Round 01: 2 Windows VMs
  - name: r01-create
    jobType: create
    namespace: burner-windows-density-escalation
    jobIterations: 1
    namespacedIterations: false
    waitWhenFinished: true
    maxWaitTimeout: 120m
    objects:
      - objectTemplate: /config/vm-template-windows.yml
        replicas: 2

  - name: r01-delete
    jobType: delete
    namespace: burner-windows-density-escalation
    waitForDeletion: true
    objects:
      - apiVersion: kubevirt.io/v1
        kind: VirtualMachine
        labelSelector:
          kube-burner.io/job: r01-create

  # Round 02: 5 Windows VMs
